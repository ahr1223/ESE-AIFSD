services:
  # Backend Service
  - type: web
    name: employee-analytics-backend
    runtime: node
    plan: free
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # Frontend Service
  - type: web
    name: employee-analytics-frontend
    runtime: node
    plan: free
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://employee-analytics-backend.onrender.com
